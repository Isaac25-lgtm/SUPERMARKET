<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Branch Till (offline-capable)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e7ec; --ink:#121a24; --muted:#6b7684; --accent:#0f766e; --bad:#be123c; --warn:#b45309; --good:#15803d; }
  * { box-sizing: border-box; } body { margin:0; font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:12px 18px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; }
  .pill { padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; } .on { background:#e6f5ea; color:var(--good);} .off { background:#fdecef; color:var(--bad);} .pend { background:#fdf3e3; color:var(--warn);}
  main { display:grid; grid-template-columns: 1fr 380px; gap:16px; padding:16px; } @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  input, select, button { font:inherit; } input, select { width:100%; height:44px; border:1px solid #cdd4dc; border-radius:10px; padding:0 12px; }
  button { height:44px; border-radius:10px; border:1px solid #cdd4dc; background:#fff; padding:0 14px; cursor:pointer; } .primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .item { text-align:left; height:auto; min-height:76px; padding:10px; } .item b { display:block; font-size:14px; } .muted { color:var(--muted); font-size:12.5px; }
  .line { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); } .total { font-size:28px; font-weight:700; }
  .test { background:#fdf3e3; color:var(--warn); padding:2px 8px; border-radius:6px; font-size:11px; font-weight:800; letter-spacing:.06em; }
  .err { color:var(--bad); margin-top:8px; } .hidden { display:none; } h2 { margin:0 0 8px; font-size:16px; }
</style>
</head>
<body>
<header>
  <strong id="brand">Branch till</strong><span class="muted" id="branch"></span><span class="test hidden" id="test">TEST DATA</span>
  <span style="flex:1"></span><span id="sync" class="pill pend">checking…</span><span id="who" class="muted"></span>
</header>
<section id="login" class="card" style="max-width:380px;margin:40px auto">
  <h2>Sign in to this till</h2>
  <p class="muted">Works without internet using your last synced access (time-limited).</p>
  <select id="reg"></select><br /><br />
  <input id="u" placeholder="Username" autocomplete="username" /><br /><br />
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" /><br /><br />
  <button class="primary" style="width:100%" onclick="doLogin()">Sign in</button>
  <div id="lerr" class="err"></div>
</section>
<main id="pos" class="hidden">
  <div class="card">
    <input id="scan" placeholder="Scan barcode, PLU, or search" autocomplete="off" />
    <div id="grid" class="grid"></div>
  </div>
  <div class="card">
    <h2>Basket</h2><div id="basketEl"></div>
    <div class="line"><span>Total</span><span class="total" id="total">0</span></div>
    <input id="cash" inputmode="numeric" placeholder="Cash received" />
    <div class="muted" id="change"></div><br />
    <button class="primary" style="width:100%" onclick="pay()">Complete sale (offline-safe)</button>
    <div id="perr" class="err"></div>
    <div id="receipt" class="muted" style="margin-top:12px"></div>
  </div>
</main>
<script>
let token = null, items = [], basket = [];
const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(Number(n)).toLocaleString('en-UG');
async function j(url, opt = {}) {
  opt.headers = Object.assign({'Content-Type': 'application/json'}, opt.headers || {}, token ? {Authorization: 'Bearer ' + token} : {});
  const r = await fetch(url, opt); const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.message || ('Error ' + r.status)); return d;
}
async function status() {
  try { const s = await j('/edge/status'); const el = document.getElementById('sync');
    el.textContent = s.state + (s.pending ? ` · ${s.pending} pending` : '') + (s.rejected ? ` · ${s.rejected} need review` : '');
    el.className = 'pill ' + (s.state === 'offline' ? 'off' : s.pending ? 'pend' : 'on'); } catch (e) {}
}
async function init() {
  const r = await j('/edge/registers'); document.getElementById('brand').textContent = r.brand || 'Branch till';
  document.getElementById('branch').textContent = r.branch ? r.branch.name : 'No snapshot yet — connect once to sync';
  if (r.test_data) document.getElementById('test').classList.remove('hidden');
  $('reg').innerHTML = (r.registers || []).map(x => `<option value="${x.id}">${x.name}</option>`).join('');
  status(); setInterval(status, 10000);
}
async function doLogin() {
  try { const s = await j('/edge/login', {method: 'POST', body: JSON.stringify({username: $('u').value, password: $('p').value, register_id: Number($('reg').value)})});
    token = s.token; document.getElementById('who').textContent = s.full_name; $('login').classList.add('hidden'); $('pos').classList.remove('hidden'); await load(); $('scan').focus();
  } catch (e) { $('lerr').textContent = e.message; }
}
async function load() { items = (await j('/edge/catalog')).items; render(); }
function render() {
  const q = $('scan').value.trim().toLowerCase();
  $('grid').innerHTML = items.filter(i => !q || i.name.toLowerCase().includes(q) || i.barcode === q || i.plu === q).slice(0, 40)
    .map(i => `<button class="item" onclick="add(${i.id})"><b>${i.name}</b><span class="muted">${fmt(i.price)}${i.sold_by_weight ? '/kg' : ''} · ${Number(i.available)} left</span></button>`).join('');
  const total = basket.reduce((s, l) => s + Math.round(l.q * Number(l.i.price)), 0);
  $('basketEl').innerHTML = basket.map((l, k) => `<div class="line"><span>${l.i.name} × ${l.q}</span><span>${fmt(l.q * l.i.price)} <button onclick="basket.splice(${k},1);render()">✕</button></span></div>`).join('') || '<p class="muted">Empty</p>';
  document.getElementById('total').textContent = 'UGX ' + fmt(total);
  const c = Number($('cash').value || 0); $('change').textContent = c >= total && total ? 'Change: UGX ' + fmt(c - total) : '';
  return total;
}
function add(id) {
  const i = items.find(x => x.id === id); let q = 1;
  if (i.sold_by_weight) { q = Number(prompt('Weight in kg for ' + i.name, '1')); if (!q) return; }
  const l = basket.find(x => x.i.id === id && !i.sold_by_weight); if (l) l.q += q; else basket.push({i, q}); render();
}
const forms = (v) => /^\d{12}$/.test(v) ? [v, '0' + v] : /^0\d{12}$/.test(v) ? [v, v.slice(1)] : [v];
$('scan').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const v = $('scan').value.trim(); const f = forms(v); const i = items.find(x => (x.barcodes || [x.barcode]).some(b => f.includes(b)) || x.plu === v); if (i) { add(i.id); $('scan').value = ''; } else if (v) { $('perr').textContent = 'Unknown barcode ' + v; } render(); } });
$('scan').addEventListener('input', render); $('cash').addEventListener('input', render);
let saleKey = crypto.randomUUID();
async function pay() {
  $('perr').textContent = ''; const total = render(); if (!basket.length) return;
  try {
    const r = await j('/edge/sales', {method: 'POST', body: JSON.stringify({client_key: saleKey, lines: basket.map(l => ({product_id: l.i.id, quantity: String(l.q)})), payments: [{method: 'cash', amount: String($('cash').value || total)}]})});
    $('receipt').innerHTML = `<b>Receipt ${r.local_receipt_no}</b><br>Total UGX ${fmt(r.total)} · ${r.status === 'pending' ? 'saved, will sync when online' : 'synced'}`;
    basket = []; $('cash').value = ''; saleKey = crypto.randomUUID(); await load(); status();
  } catch (e) { $('perr').textContent = e.message; }
}
init();
</script>
</body>
</html>
