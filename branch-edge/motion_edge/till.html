<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Branch Till (offline-capable)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e7ec; --ink:#121a24; --muted:#6b7684; --accent:#0f766e; --bad:#be123c; --warn:#b45309; --good:#15803d; }
  * { box-sizing: border-box; } body { margin:0; font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:12px 18px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; }
  .pill { padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; } .on { background:#e6f5ea; color:var(--good);} .off { background:#fdecef; color:var(--bad);} .pend { background:#fdf3e3; color:var(--warn);}
  main { display:grid; grid-template-columns: 1fr 380px; gap:16px; padding:16px; } @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  input, select, button { font:inherit; } input, select { width:100%; height:44px; border:1px solid #cdd4dc; border-radius:10px; padding:0 12px; }
  button { height:44px; border-radius:10px; border:1px solid #cdd4dc; background:#fff; padding:0 14px; cursor:pointer; } .primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; margin-top:10px; }
  .item { text-align:left; height:auto; min-height:76px; padding:10px; } .item b { display:block; font-size:14px; } .muted { color:var(--muted); font-size:12.5px; }
  .line { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); } .total { font-size:28px; font-weight:700; }
  .test { background:#fdf3e3; color:var(--warn); padding:2px 8px; border-radius:6px; font-size:11px; font-weight:800; letter-spacing:.06em; }
  .err { color:var(--bad); margin-top:8px; } .hidden { display:none; } h2 { margin:0 0 8px; font-size:16px; }
</style>
</head>
<body>
<header>
  <strong id="brand">Branch till</strong><span class="muted" id="branch"></span><span class="test hidden" id="test">TEST DATA</span>
  <span style="flex:1"></span><span id="sync" class="pill pend">checking…</span><span id="who" class="muted"></span>
</header>
<section id="login" class="card" style="max-width:380px;margin:40px auto">
  <h2>Sign in to this till</h2>
  <p class="muted">Works without internet using your last synced access (time-limited).</p>
  <select id="reg"></select><br /><br />
  <input id="u" placeholder="Username" autocomplete="username" /><br /><br />
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" /><br /><br />
  <button class="primary" style="width:100%" id="sign-in">Sign in</button>
  <div id="lerr" class="err"></div>
</section>
<main id="pos" class="hidden">
  <div class="card">
    <input id="scan" placeholder="Scan barcode, PLU, or search" autocomplete="off" />
    <div id="grid" class="grid"></div>
  </div>
  <div class="card">
    <h2>Basket</h2><div id="basketEl"></div>
    <div class="line"><span>Total</span><span class="total" id="total">0</span></div>
    <input id="cash" inputmode="numeric" placeholder="Cash received" />
    <div class="muted" id="change"></div><br />
    <button class="primary" style="width:100%" id="complete-sale">Complete sale (offline-safe)</button>
    <div id="perr" class="err"></div>
    <div id="receipt" class="muted" style="margin-top:12px"></div>
  </div>
</main>
<script src="/till.js" defer></script>
</body>
</html>
