[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-branch-edge"
version = "0.2.0"
description = "Motion Imprints branch edge: offline till server with durable outbox sync"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "argon2-cffi>=23", "pydantic>=2.8", "cryptography>=43"]

[tool.setuptools]
packages = ["motion_edge"]

[tool.setuptools.package-data]
motion_edge = ["till.html", "till.js", "web/**/*"]

[project.scripts]
motion-branch-box = "motion_edge.__main__:main"
