# Render Blueprint — one Docker web service. The database is Neon (external),
# supplied as the DATABASE_URL secret. Never put secrets in this file.
services:
  - type: web
    name: motion-supermarket
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: ohio            # Neon project is in AWS us-east-2 (Ohio): keep latency ~1-2 ms
    plan: starter           # 512 MB RAM, always on. "free" works for demos but sleeps after 15 min idle
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false         # set in the Render dashboard: Neon connection string
      - key: MOTION_SECRET_KEY
        generateValue: true
      # CLIENT-SAFE TEMPLATE (Codex C2): a client deployment refuses to start if any
      # demo/seed switch is on. The isolated synthetic demo service instead sets
      # MOTION_DEPLOYMENT=demo, MOTION_DEMO_MODE=1, MOTION_SEED_DEMO=1, MOTION_OPEN_DEMO=1
      # (+ MOTION_SEED_PASSWORD_SECRET) in its own dashboard - never on client data.
      - key: MOTION_DEPLOYMENT
        value: client
      - key: MOTION_AUTO_BOOTSTRAP
        value: "1"
      - key: MOTION_DEMO_MODE
        value: "0"
      - key: MOTION_SEED_DEMO
        value: "0"
      - key: MOTION_OPEN_DEMO
        value: "0"
      - key: MOTION_SESSION_IDLE_MINUTES
        value: "5"
      - key: MOTION_DB_PREFER_DIRECT
        value: "1"          # use Neon's direct endpoint, not the -pooler host
      - key: MOTION_DB_MAXCONN
        value: "6"
      - key: MOTION_BRAND_NAME
        value: FreshWay Supermarkets
      - key: MOTION_COMPANY_NAME
        value: FreshWay Supermarkets Ltd
      - key: MOTION_TIMEZONE
        value: Africa/Kampala
